<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entretien">
<title>Entretien auto</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2F4;--card:#fff;--ink:#1B2430;--mute:#66707D;--line:#DADDE2;--acc:#0F5C7A;--ok:#2E7D4F;--warn:#B86E00;--bad:#B3261E;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14181D;--card:#1F252C;--ink:#ECEEF1;--mute:#9AA3AE;--line:#313944;--acc:#5BB6D6;--ok:#6CC38C;--warn:#E5A33D;--bad:#F0807A;--onacc:#0B1218}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,-apple-system,Helvetica,Arial,sans-serif;max-width:560px;padding:16px 16px 90px}
h1,h2{font-family:"Barlow Semi Condensed",-apple-system,Helvetica,sans-serif;margin:0}
h1{font-size:28px}h2{font-size:20px;margin:22px 0 8px}
button,input,select{font:inherit;color:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.km{display:flex;justify-content:space-between;align-items:center}
.km b{font:700 34px "Barlow Semi Condensed",sans-serif}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:10px;padding:11px 16px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.del{background:transparent;color:var(--bad);padding:4px 8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 22px}
.st{display:flex;justify-content:space-between;gap:10px;align-items:center}
.st small,.mute{color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-right:10px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.none{background:var(--line)}
.tag{font-weight:500}.tag.warn{color:var(--warn);background:none}.tag.bad{color:var(--bad);background:none}.tag.ok{color:var(--ok);background:none}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
.pick{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);font-size:16px}
.pick input[type=checkbox]{width:20px;height:20px;flex:none}
.pick input[type=number]{width:84px;flex:none;padding:6px}
.pick span{flex:1}
dialog{max-height:88vh;overflow-y:auto}
.row input{min-width:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.fold{background:none;border:0;padding:0;font:inherit;color:inherit;display:flex;gap:8px;align-items:center;cursor:pointer}
#msg{color:var(--bad);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<h1>Entretien auto</h1>
<div id="main"><div class="empty">Chargement…</div></div>

<dialog id="dV"><h2>Nouveau véhicule</h2>
<label>Nom</label><input id="vn" placeholder="Clio de Marie">
<label>Kilométrage actuel</label><input id="vk" type="number" inputmode="numeric" placeholder="85000">
<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="saveV">Ajouter</button></div></dialog>

<dialog id="dE"><h2>Nouvel entretien</h2>
<label>Date</label><input id="ed" type="date">
<label>Kilométrage</label><input id="ek" type="number" inputmode="numeric">
<label>Entretiens effectués (coche, coût en option)</label><div id="etl"></div>
<label>Note (pour tous)</label><input id="en" placeholder="Garage, pièces...">
<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="saveE">Enregistrer</button></div></dialog>

<dialog id="dI"><h2>Intervalles d'entretien</h2>
<p class="mute" style="margin:6px 0 14px">Réglages pour ce véhicule. Mets 0 km et 0 mois pour ne pas suivre un entretien. Le premier seuil atteint déclenche l'alerte.</p>
<div id="ivl"></div>
<div class="row" style="margin-top:16px;justify-content:space-between"><button class="btn del" id="resetI">Réinitialiser</button><div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="saveI">Enregistrer</button></div></div></dialog>

<input type="file" id="imp" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDNcQNfHUOg9HE8Co1A_I4s4gbfYNo6wAQ",
  authDomain:"entretienauto-36da0.firebaseapp.com",
  projectId:"entretienauto-36da0",
  storageBucket:"entretienauto-36da0.firebasestorage.app",
  messagingSenderId:"74471275451",
  appId:"1:74471275451:web:c49843bfb76727b292629e"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache()})}catch(e){db=initializeFirestore(app,{})}

const TYPES={
"Vidange Moteur + Filtre à Huile":{km:10000,m:12},
"Filtre à Air":{km:20000,m:24},
"Filtre d'Habitacle (Pollens)":{km:15000,m:12},
"Filtre à Carburant (Gazole/Essence)":{km:40000,m:48},
"Bougies d'allumage":{km:60000,m:48},
"Bougies de préchauffage":{km:100000,m:0},
"Liquide de Frein (Purge)":{km:0,m:24},
"Liquide de Refroidissement":{km:60000,m:48},
"Courroie de Distribution + Pompe à eau":{km:100000,m:60},
"Courroie d'Accessoires":{km:100000,m:60},
"Plaquettes de Frein":{km:30000,m:24},
"Disques de Frein":{km:60000,m:0},
"Vidange Boîte de Vitesses":{km:60000,m:48},
"Contrôle Technique":{km:0,m:24},
"Autre (préciser en note)":{km:0,m:0}
};
const ALIAS={"Vidange":"Vidange Moteur + Filtre à Huile","Freins":"Plaquettes de Frein","Courroie de distribution":"Courroie de Distribution + Pompe à eau","Contrôle technique":"Contrôle Technique","Autre":"Autre (préciser en note)"};
const norm=t=>ALIAS[t]||t;
const cfgOf=(v,t)=>(v.iv&&v.iv[t])||TYPES[t];
let S={v:[],e:[]},sel=null,ref=null,unsub=null,user=null;
try{sel=localStorage.getItem("sel")}catch(e){}
let open=true;try{open=localStorage.getItem("suiviOpen")!=="0"}catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("fr-FR");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cur=()=>S.v.find(v=>v.id===sel);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{if(ref)setDoc(ref,S).catch(e=>alert("Erreur de sauvegarde : "+e.message))};
const pick=id=>{sel=id;try{localStorage.setItem("sel",id||"")}catch(e){}};

function status(v,t){
 const cfg=cfgOf(v,t);if(!cfg.km&&!cfg.m)return null;
 const last=S.e.filter(x=>x.vid===v.id&&norm(x.type)===t).sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(!last)return{c:"none",txt:"Jamais fait",sub:"Ajoute le dernier entretien"};
 let left=[],level=0;
 if(cfg.km&&last.km!=null){const r=last.km+cfg.km-v.km;left.push(r>=0?"dans "+fmt(r)+" km":"dépassé de "+fmt(-r)+" km");level=Math.max(level,r<0?2:r<cfg.km*.1?1:0)}
 if(cfg.m){const d=new Date(last.date);d.setMonth(d.getMonth()+cfg.m);const days=Math.round((d-new Date())/864e5);
  left.push(days>=0?"dans "+(days>60?Math.round(days/30)+" mois":days+" j"):"dépassé de "+(-days>60?Math.round(-days/30)+" mois":-days+" j"));
  level=Math.max(level,days<0?2:days<30?1:0)}
 return{c:["ok","warn","bad"][level],txt:["À jour","Bientôt","En retard"][level],sub:left.join(" · ")};
}

function render(){
 const m=$("main");
 if(!user){m.innerHTML=`<div class="card" style="margin-top:20px"><p>Connecte-toi pour retrouver tes véhicules sur tous tes appareils.</p><button class="btn" id="login">Se connecter avec Google</button><div id="msg"></div></div>`;return}
 if(!cur()&&S.v[0])pick(S.v[0].id);
 const chips=`<div class="chips">`+S.v.map(v=>`<button class="chip ${v.id===sel?"on":""}" data-sel="${v.id}">${esc(v.name)}</button>`).join("")+`<button class="chip" id="addV">+ Véhicule</button></div>`;
 const foot=`<div class="row" style="margin-top:22px"><button class="btn ghost" id="exp">Exporter</button><button class="btn ghost" id="impb">Importer</button><button class="btn ghost" id="logout">Déconnexion</button></div><p class="mute" style="font-size:13px">Connecté : ${esc(user.email)}</p>`;
 const v=cur();
 if(!v){m.innerHTML=chips+`<div class="empty">Aucun véhicule.<br>Ajoute le premier avec « + Véhicule ».</div>`+foot;return}
 const ents=S.e.filter(x=>x.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date));
 const total=ents.reduce((s,x)=>s+(+x.cost||0),0);
 const rows=Object.keys(TYPES).map(t=>({t,s:status(v,t)})).filter(x=>x.s).sort((a,b)=>["bad","warn","none","ok"].indexOf(a.s.c)-["bad","warn","none","ok"].indexOf(b.s.c));
 m.innerHTML=chips+`
 <div class="card km"><div><span class="mute">Kilométrage</span><br><b>${fmt(v.km)} km</b></div><button class="btn ghost" id="upKm">Mettre à jour</button></div>
 <div class="row" style="justify-content:space-between;margin:22px 0 8px"><h2 style="margin:0"><button class="fold" id="fold" aria-expanded="${open}"><span aria-hidden="true">${open?"▾":"▸"}</span> Suivi</button></h2><button class="btn ghost" id="iv">Intervalles</button></div>
 ${open?rows.map(({t,s})=>`<div class="card st"><div class="row" style="flex-wrap:nowrap"><span class="dot ${s.c}"></span><div><b>${t}</b><br><small>${s.sub}</small></div></div><span class="tag ${s.c}">${s.txt}</span></div>`).join(""):""}
 <div class="row" style="justify-content:space-between;margin:22px 0 8px"><h2 style="margin:0">Historique <small class="mute" style="font-size:15px">· ${fmt(total)} € au total</small></h2>${ents.length?`<button class="btn ghost" id="pdf">Exporter PDF</button>`:""}</div>
 ${ents.length?ents.map(x=>`<div class="card st"><div><b>${esc(x.type)}</b> <small>${new Date(x.date).toLocaleDateString("fr-FR")}${x.km!=null?" · "+fmt(x.km)+" km":""}</small><br><small>${x.cost?fmt(x.cost)+" €":""}${x.note?(x.cost?" · ":"")+esc(x.note):""}</small></div><button class="btn del" data-del="${x.id}">Suppr.</button></div>`).join(""):`<div class="empty">Aucun entretien enregistré.</div>`}
 <div style="margin-top:12px"><button class="btn del" id="delV">Supprimer ce véhicule</button></div>
 ${foot}
 <button class="btn fab" id="addE">+ Entretien</button>`;
}

function start(u){
 user=u;if(unsub){unsub();unsub=null}
 if(!u){ref=null;S={v:[],e:[]};render();return}
 ref=doc(db,"users",u.uid);render();
 unsub=onSnapshot(ref,snap=>{const d=snap.data();S={v:(d&&d.v)||[],e:(d&&d.e)||[]};render()},err=>{$("main").innerHTML=`<div class="card"><b>Accès refusé</b><p class="mute">${esc(err.message)}</p><p class="mute">Vérifie les règles Firestore.</p></div>`});
}
onAuthStateChanged(auth,start);

const IK=Object.keys(TYPES).filter(t=>!t.startsWith("Autre"));
function openIv(){
 const v=cur();
 $("ivl").innerHTML=IK.map((t,i)=>{const c=cfgOf(v,t);return `<div style="margin-bottom:12px"><b>${esc(t)}</b><div class="row" style="flex-wrap:nowrap;margin-top:4px"><input type="number" inputmode="numeric" min="0" id="ik${i}" value="${c.km}" aria-label="Kilomètres"><span class="mute">km</span><input type="number" inputmode="numeric" min="0" id="im${i}" value="${c.m}" aria-label="Mois"><span class="mute">mois</span></div></div>`}).join("");
 $("dI").showModal();
}
function saveIv(){
 const v=cur(),iv={};
 IK.forEach((t,i)=>{const k=Math.max(0,+$("ik"+i).value||0),m=Math.max(0,+$("im"+i).value||0);if(k!==TYPES[t].km||m!==TYPES[t].m)iv[t]={km:k,m}});
 if(Object.keys(iv).length)v.iv=iv;else delete v.iv;
 save();$("dI").close();render();
}
function pdf(){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J){alert("Module PDF non chargé : vérifie ta connexion et recharge la page.");return}
 const v=cur(),ents=S.e.filter(x=>x.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date));
 const d=new J({unit:"mm",format:"a4"}),n=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g," "),c=s=>String(s||"").replace(/[^\x20-\x7E\u00A0-\u00FF]/g,"?"),dt=s=>s.split("-").reverse().join("/");
 const total=ents.reduce((a,x)=>a+(+x.cost||0),0);
 d.setFont("helvetica","bold");d.setFontSize(18);d.text("Historique d'entretien",14,18);
 d.setFontSize(12);d.text(c(v.name),14,26);
 d.setFont("helvetica","normal");d.setFontSize(10);
 d.text("Kilométrage actuel : "+n(v.km)+" km  |  Généré le "+dt(today())+"  |  Total : "+n(total)+" EUR",14,32);
 const X=[14,34,92,120,150];let y=42;
 const head=()=>{d.setFont("helvetica","bold");d.setFontSize(10);["Date","Type","Km","Coût","Note"].forEach((t,i)=>d.text(t,X[i],y));d.line(14,y+2,196,y+2);y+=8;d.setFont("helvetica","normal")};
 head();
 ents.forEach(x=>{
  const type=d.splitTextToSize(c(x.type),56),note=d.splitTextToSize(c(x.note),46),h=Math.max(type.length,note.length)*5+2;
  if(y+h>285){d.addPage();y=20;head()}
  d.text(dt(x.date),X[0],y);d.text(type,X[1],y);d.text(x.km!=null?n(x.km):"-",X[2],y);d.text(x.cost?n(x.cost)+" EUR":"-",X[3],y);d.text(note,X[4],y);
  y+=h;
 });
 d.save("entretien-"+c(v.name).replace(/[^\w-]+/g,"_")+"-"+today()+".pdf");
}

document.addEventListener("click",async e=>{
 const t=e.target;
 if(t.id==="login"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){
   if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment"){signInWithRedirect(auth,new GoogleAuthProvider())}
   else if(err.code!=="auth/popup-closed-by-user"&&err.code!=="auth/cancelled-popup-request"){const m=$("msg");if(m)m.textContent="Connexion impossible : "+(err.code||err.message)}}}
 if(t.closest("#fold")){open=!open;try{localStorage.setItem("suiviOpen",open?"1":"0")}catch(e){}render()}
 if(t.id==="pdf")pdf();
 if(t.id==="iv")openIv();
 if(t.id==="saveI")saveIv();
 if(t.id==="resetI"&&confirm("Revenir aux intervalles par défaut pour ce véhicule ?")){delete cur().iv;save();$("dI").close();render()}
 if(t.id==="logout")signOut(auth);
 if(t.dataset.sel){pick(t.dataset.sel);render()}
 if(t.id==="addV"){$("vn").value="";$("vk").value="";$("dV").showModal()}
 if(t.dataset.close!==undefined)t.closest("dialog").close();
 if(t.id==="saveV"){const n=$("vn").value.trim();if(!n){$("vn").focus();return}
  const v={id:uid(),name:n,km:+$("vk").value||0};S.v.push(v);pick(v.id);save();$("dV").close();render()}
 if(t.id==="upKm"){const k=prompt("Kilométrage actuel :",cur().km);if(k!==null&&k!==""&&+k>=0){cur().km=+k;save();render()}}
 if(t.id==="addE"){$("etl").innerHTML=Object.keys(TYPES).map((x,i)=>`<label class="pick"><input type="checkbox" id="ec${i}"><span>${esc(x)}</span><input type="number" inputmode="decimal" id="ep${i}" placeholder="€" aria-label="Coût"></label>`).join("");$("ed").value=today();$("ek").value=cur().km||"";$("en").value="";$("dE").showModal()}
 if(t.id==="saveE"){const v=cur(),km=$("ek").value===""?null:+$("ek").value;
  const TK=Object.keys(TYPES),ch=TK.map((x,i)=>({x,i})).filter(o=>$("ec"+o.i).checked);
  if(!ch.length){alert("Coche au moins un entretien.");return}
  ch.forEach(o=>S.e.push({id:uid()+o.i,vid:v.id,type:o.x,date:$("ed").value||today(),km,cost:+$("ep"+o.i).value||0,note:$("en").value.trim()}));
  if(km!=null&&km>v.km)v.km=km;save();$("dE").close();render()}
 if(t.dataset.del&&confirm("Supprimer cet entretien ?")){S.e=S.e.filter(x=>x.id!==t.dataset.del);save();render()}
 if(t.id==="delV"&&confirm("Supprimer ce véhicule et son historique ?")){const id=sel;S.v=S.v.filter(x=>x.id!==id);S.e=S.e.filter(x=>x.vid!==id);pick(S.v[0]?S.v[0].id:null);save();render()}
 if(t.id==="exp"){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="entretien-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
 if(t.id==="impb")$("imp").click();
});
$("etl").addEventListener("input",e=>{const m=/^ep(\d+)$/.exec(e.target.id);if(m&&e.target.value)$("ec"+m[1]).checked=true});
$("imp").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.v)||!Array.isArray(d.e))throw 0;
  if(confirm("Remplacer toutes tes données actuelles par cette sauvegarde ?")){S={v:d.v,e:d.e};pick(S.v[0]?S.v[0].id:null);save();render()}}
 catch(err){alert("Fichier de sauvegarde invalide.")}
});
</script>
</body>
</html>
