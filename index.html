<div class="container py-3" style="max-width:560px;padding-bottom:110px">
<div id="main"><div class="text-center text-body-secondary py-5">Chargement…</div></div>
</div>

<dialog id="dV"><div class="p-4"><h2 class="h5 mb-3">Nouveau véhicule</h2>
<label class="form-label">Nom</label><input class="form-control" id="vn" placeholder="Clio de Marie">
<label class="form-label mt-3">Kilométrage actuel</label><input class="form-control" id="vk" type="number" inputmode="numeric" placeholder="85000">
<div class="d-flex gap-2 justify-content-end mt-4"><button class="btn btn-outline-secondary" data-close>Annuler</button><button class="btn btn-primary" id="saveV">Ajouter</button></div></div></dialog>

<dialog id="dE"><div class="p-4"><h2 class="h5 mb-3" id="eh">Nouvel entretien</h2>
<label class="form-label">Date</label><input class="form-control" id="ed" type="date">
<label class="form-label mt-3">Kilométrage</label><input class="form-control" id="ek" type="number" inputmode="numeric">
<label class="form-label mt-3">Entretiens effectués</label><div id="etl"></div>
<label class="form-label mt-3">Coût total (€)</label><input class="form-control" id="etot" type="number" inputmode="decimal" placeholder="0">

<dialog id="dI"><div class="p-4"><h2 class="h5">Intervalles d'entretien</h2>
<p class="text-body-secondary small mb-3">Réglages pour ce véhicule. Mets 0 km et 0 mois pour ne pas suivre un entretien. Le premier seuil atteint déclenche l'alerte.</p>
<div id="ivl"></div>
<div class="d-flex gap-2 justify-content-between mt-3"><button class="btn btn-outline-danger" id="resetI">Réinitialiser</button><div class="d-flex gap-2"><button class="btn btn-outline-secondary" data-close>Annuler</button><button class="btn btn-primary" id="saveI">Enregistrer</button></div></div></div></dialog>

<input type="file" id="imp" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDNcQNfHUOg9HE8Co1A_I4s4gbfYNo6wAQ",
  authDomain:"entretienauto-36da0.firebaseapp.com",
  projectId:"entretienauto-36da0",
  storageBucket:"entretienauto-36da0.firebasestorage.app",
  messagingSenderId:"74471275451",
  appId:"1:74471275451:web:c49843bfb76727b292629e"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache()})}catch(e){db=initializeFirestore(app,{})}

const TYPES={
"Vidange Moteur + Filtre à Huile":{km:10000,m:12},
"Filtre à Air":{km:20000,m:24},
"Filtre d'Habitacle (Pollens)":{km:15000,m:12},
"Filtre à Carburant (Gazole/Essence)":{km:40000,m:48},
"Bougies d'allumage":{km:60000,m:48},
"Bougies de préchauffage":{km:100000,m:0},
"Liquide de Frein (Purge)":{km:0,m:24},
"Liquide de Refroidissement":{km:60000,m:48},
"Courroie de Distribution + Pompe à eau":{km:100000,m:60},
"Courroie d'Accessoires":{km:100000,m:60},
"Plaquettes de Frein (Avant)":{km:30000,m:24},
"Plaquettes de Frein (Arrière)":{km:50000,m:36},
"Disques de Frein (Avant)":{km:60000,m:0},
"Disques de Frein (Arrière)":{km:80000,m:0},
"Amortisseurs (Avant)":{km:80000,m:0},
"Amortisseurs (Arrière)":{km:80000,m:0},
"Pneus (Avant)":{km:40000,m:0},
"Pneus (Arrière)":{km:50000,m:0},
"Géométrie (Parallélisme)":{km:20000,m:24},
"Vidange Boîte de Vitesses":{km:60000,m:48},
"Remplacement Kit Embrayage":{km:120000,m:0},
"Batterie":{km:0,m:60},
"Contrôle Technique":{km:0,m:24},
"Autre (préciser en note)":{km:0,m:0}
};
const ALIAS={"Vidange":"Vidange Moteur + Filtre à Huile","Freins":"Plaquettes de Frein","Courroie de distribution":"Courroie de Distribution + Pompe à eau","Contrôle technique":"Contrôle Technique","Autre":"Autre (préciser en note)"};
const norm=t=>ALIAS[t]||t;
const cfgOf=(v,t)=>(v.iv&&v.iv[t])||TYPES[t];
const ICONS={"Vidange Moteur + Filtre à Huile":"🛢️","Filtre à Air":"🌬️","Filtre d'Habitacle (Pollens)":"🌸","Filtre à Carburant (Gazole/Essence)":"⛽","Bougies d'allumage":"⚡","Bougies de préchauffage":"🔥","Liquide de Frein (Purge)":"💧","Liquide de Refroidissement":"❄️","Courroie de Distribution + Pompe à eau":"⚙️","Courroie d'Accessoires":"🔗","Plaquettes de Frein":"🛑","Disques de Frein":"💿","Amortisseurs":"🔩","Pneus":"🛞","Géométrie (Parallélisme)":"📐","Vidange Boîte de Vitesses":"🕹️","Remplacement Kit Embrayage":"🦶","Batterie":"🔋","Contrôle Technique":"📋"};
const BS={ok:"success",warn:"warning",bad:"danger",none:"secondary"};
const iconOf=t=>ICONS[baseOf(t)]||"🔧";
const baseOf=t=>t.replace(/ \((Avant|Arrière)\)$/,"");
let S={v:[],e:[]},sel=null,ref=null,unsub=null,user=null;
try{sel=localStorage.getItem("sel")}catch(e){}
let editG=null,editKeep=[],ready=false,last="{}";
let open=true;try{open=localStorage.getItem("suiviOpen")!=="0"}catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("fr-FR");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cur=()=>S.v.find(v=>v.id===sel);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{if(!ref)return;if(!ready){alert("Synchronisation avec le serveur en cours : rien n'a été modifié. Vérifie ta connexion et réessaie dans quelques secondes.");try{S=JSON.parse(last)}catch(e){}render();return}setDoc(ref,S).catch(e=>alert("Erreur de sauvegarde : "+e.message))};
const pick=id=>{sel=id;try{localStorage.setItem("sel",id||"")}catch(e){}};

function status(v,t){
 const cfg=cfgOf(v,t);if(!cfg.km&&!cfg.m)return null;
 const last=S.e.filter(x=>x.vid===v.id&&(norm(x.type)===t||norm(x.type)===baseOf(t))).sort((a,b)=>b.date.localeCompare(a.date))[0];
 const ck=v.ck&&v.ck[t];
 if(!last&&!ck)return{c:"none",txt:"Jamais fait",sub:"Ajoute le dernier entretien",chk:true};
 const base=(ck&&(!last||ck.date>=last.date))?{date:ck.date,km:ck.km,chk:true}:last;
 let left=[],level=0;
 if(base.chk)left.push("vérifié le "+new Date(base.date).toLocaleDateString("fr-FR"));
 if(cfg.km&&base.km!=null){const r=base.km+cfg.km-v.km;left.push(r>=0?"dans "+fmt(r)+" km":"dépassé de "+fmt(-r)+" km");level=Math.max(level,r<0?2:r<cfg.km*.1?1:0)}
 if(cfg.m){const d=new Date(base.date);d.setMonth(d.getMonth()+cfg.m);const days=Math.round((d-new Date())/864e5);
  left.push(days>=0?"dans "+(days>60?Math.round(days/30)+" mois":days+" j"):"dépassé de "+(-days>60?Math.round(-days/30)+" mois":-days+" j"));
  level=Math.max(level,days<0?2:days<30?1:0)}
 return{c:["ok","warn","bad"][level],txt:["À jour","Bientôt","En retard"][level],sub:left.join(" · "),chk:level>0};
}

function render(){
 const m=$("main");
 if(!user){m.innerHTML=`<div class="card shadow-sm mt-4"><div class="card-body text-center p-4"><p class="mb-3">Connecte-toi pour retrouver tes véhicules sur tous tes appareils.</p><button class="btn btn-primary w-100" id="login">Se connecter avec Google</button><div id="msg" class="text-danger small mt-2"></div></div></div>`;return}
 if(!cur()&&S.v[0])pick(S.v[0].id);
 const chips=(ready?"":`<div class="alert alert-info py-2 small mt-1 mb-0">Synchronisation avec le serveur… (modifications bloquées tant que tes données ne sont pas chargées)</div>`)+`<div class="d-flex gap-2 overflow-auto py-3">`+S.v.map(v=>`<button class="btn btn-sm rounded-pill flex-shrink-0 ${v.id===sel?"btn-primary":"btn-outline-secondary"}" data-sel="${v.id}">${esc(v.name)}</button>`).join("")+`<button class="btn btn-sm btn-outline-primary rounded-pill flex-shrink-0" id="addV">+ Véhicule</button></div>`;
 const foot=`<div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-sm btn-outline-secondary" id="exp">Exporter</button><button class="btn btn-sm btn-outline-secondary" id="impb">Importer</button>${cur()?`<button class="btn btn-sm btn-outline-secondary" id="renV">Renommer</button>`:""}<button class="btn btn-sm btn-outline-secondary" id="logout">Déconnexion</button></div><p class="text-body-secondary small mt-2 mb-0">Connecté : ${esc(user.email)}</p>`;
 const v=cur();
 if(!v){m.innerHTML=chips+`<div class="text-center text-body-secondary py-5">Aucun véhicule.<br>Ajoute le premier avec « + Véhicule ».</div>`+foot;return}
 const ents=S.e.filter(x=>x.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date));
 const total=ents.reduce((s,x)=>s+(+x.cost||0),0);
 const rows=Object.keys(TYPES).map(t=>({t,s:status(v,t)})).filter(x=>x.s).sort((a,b)=>["bad","warn","none","ok"].indexOf(a.s.c)-["bad","warn","none","ok"].indexOf(b.s.c));
 m.innerHTML=chips+`
 <div class="card shadow-sm mb-4"><div class="card-body d-flex justify-content-between align-items-center"><div><div class="text-body-secondary small">Kilométrage</div><div class="fs-2 fw-bold lh-1">${fmt(v.km)} km</div></div><button class="btn btn-outline-primary" id="upKm">Mettre à jour</button></div></div>
 <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h5 mb-0"><button class="btn btn-link text-reset text-decoration-none p-0 fw-semibold fs-5" id="fold" aria-expanded="${open}">${open?"▾":"▸"} Suivi</button></h2><button class="btn btn-sm btn-outline-primary" id="iv">Intervalles</button></div>
 ${open?`<div class="list-group shadow-sm mb-4">${rows.map(({t,s})=>`<div class="list-group-item d-flex justify-content-between align-items-center gap-2 lb-${s.c}"><div class="d-flex align-items-center"><span class="ico" aria-hidden="true">${iconOf(t)}</span><div><div class="fw-semibold">${t}</div><div class="small text-body-secondary">${s.sub}</div></div></div><div class="text-end flex-shrink-0"><span class="badge text-bg-${BS[s.c]}">${s.txt}</span>${s.chk?`<div class="mt-1"><button class="btn btn-sm btn-outline-secondary py-0 px-2" data-chk="${Object.keys(TYPES).indexOf(t)}">Vérifié ✓</button></div>`:""}</div></div>`).join("")}</div>`:""}
 <div class="d-flex justify-content-between align-items-center mb-2 mt-4"><h2 class="h5 mb-0">Historique <small class="text-body-secondary fs-6 fw-normal">· ${fmt(total)} € au total</small></h2>${ents.length?`<button class="btn btn-sm btn-outline-primary" id="pdf">Exporter PDF</button>`:""}</div>
 ${ents.length?groups(ents).map(g=>{const cost=g.items.reduce((a,x)=>a+(+x.cost||0),0),notes=[...new Set(g.items.map(x=>x.note).filter(Boolean))].map(esc).join(" · ");return `<div class="card shadow-sm mb-2"><div class="card-body py-2"><div class="d-flex justify-content-between align-items-center mb-1"><div><span class="fw-semibold">${new Date(g.date).toLocaleDateString("fr-FR")}</span>${g.km!=null?` <small class="text-body-secondary">· ${fmt(g.km)} km</small>`:""}</div><button class="btn btn-sm btn-outline-primary" data-edit="${g.date}|${g.km==null?"":g.km}">Modifier</button></div>${g.items.map(x=>`<div class="py-1">${esc(norm(x.type))}</div>`).join("")}${(cost||notes)?`<div class="text-body-secondary small border-top pt-2 mt-1">${cost?"Total : "+fmt(cost)+" €":""}${cost&&notes?" · ":""}${notes}</div>`:""}</div></div>`}).join(""):`<div class="text-center text-body-secondary py-4">Aucun entretien enregistré.</div>`}
 <div class="mt-3"><button class="btn btn-sm btn-outline-danger" id="delV">Supprimer ce véhicule</button></div>
 ${foot}
 <button class="btn btn-primary btn-lg rounded-pill shadow position-fixed start-50 translate-middle-x px-4" style="bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1030" id="addE">+ Entretien</button>`;
}

function start(u){
 user=u;ready=false;last="{}";if(unsub){unsub();unsub=null}
 if(!u){ref=null;S={v:[],e:[]};render();return}
 ref=doc(db,"users",u.uid);render();
 unsub=onSnapshot(ref,{includeMetadataChanges:true},snap=>{
  const d=snap.data(),fromServer=!snap.metadata.fromCache;
  if(fromServer)ready=true;
  if(snap.exists()||fromServer){S={v:(d&&d.v)||[],e:(d&&d.e)||[]};last=JSON.stringify(S)}
  render()},err=>{$("main").innerHTML=`<div class="alert alert-danger mt-3"><b>Accès refusé</b><p class="mb-1">${esc(err.message)}</p><p class="mb-0">Vérifie les règles Firestore.</p></div>`});
}
onAuthStateChanged(auth,start);

function groups(ents){const m=new Map();ents.forEach(x=>{const k=x.date+"|"+(x.km==null?"":x.km);if(!m.has(k))m.set(k,{date:x.date,km:x.km,items:[]});m.get(k).items.push(x)});return [...m.values()]}
function openE(g){
 const v=cur(),ks=Object.keys(TYPES);
 editG=g?g.items.map(x=>x.id):null;editKeep=[];
$("delE").hidden=!g;
 $("eh").textContent=g?"Modifier l'entretien":"Nouvel entretien";
 $("etl").innerHTML=etlHtml(g?new Set(g.items.map(x=>norm(x.type))):null);
 $("ed").value=g?g.date:today();
 $("ek").value=g?(g.km==null?"":g.km):(v.km||"");
 $("etot").value=g?(g.items.reduce((a,x)=>a+(+x.cost||0),0)||""):"";
 $("en").value=g?[...new Set(g.items.map(x=>x.note).filter(Boolean))].join(" · "):"";
 if(g)g.items.forEach(x=>{
  const t=norm(x.type),i=ks.indexOf(t);
  if(i>=0&&$("ec"+i)){$("ec"+i).checked=true;const b=baseOf(t);if(b!==t){const f=ks.findIndex(k=>baseOf(k)===b),m=$("eg"+f);if(m){m.checked=true;$("es"+f).hidden=false}}}
  else{const f=ks.findIndex(k=>baseOf(k)===t&&k!==t),m=f>=0&&$("eg"+f);if(m){m.checked=true;$("es"+f).hidden=false}else editKeep.push(x)}
 });
 $("dE").showModal();
}
function etlHtml(F){
 const v=cur(),ks=Object.keys(TYPES),seen={},ok=t=>{const c=cfgOf(v,t);return c.km||c.m||t.startsWith("Autre")||(F&&F.has(t))};
 return ks.map((t,i)=>{
  const b=baseOf(t);
  if(b===t)return ok(t)?`<label class="pick d-flex align-items-center gap-2 border rounded-3 px-3 py-2 mb-2"><input type="checkbox" class="form-check-input m-0 flex-shrink-0" style="width:1.25em;height:1.25em" id="ec${i}"><span>${esc(t)}</span></label>`:"";
  if(seen[b])return "";seen[b]=1;
  const subs=ks.map((u,j)=>({u,j})).filter(o=>baseOf(o.u)===b&&ok(o.u));
  if(!subs.length)return "";
  return `<div class="pickg"><label class="pick d-flex align-items-center gap-2 border rounded-3 px-3 py-2 mb-2"><input type="checkbox" class="form-check-input m-0 flex-shrink-0" style="width:1.25em;height:1.25em" id="eg${i}"><span>${esc(b)}</span></label><div class="sub" id="es${i}" hidden>${subs.map(o=>`<label class="pick d-flex align-items-center gap-2 border rounded-3 px-3 py-2"><input type="checkbox" class="form-check-input m-0 flex-shrink-0" style="width:1.25em;height:1.25em" id="ec${o.j}"><span>${/Avant/.test(o.u)?"Avant":"Arrière"}</span></label>`).join("")}</div></div>`}).join("");
}
const IK=Object.keys(TYPES).filter(t=>!t.startsWith("Autre"));
function openIv(){
 const v=cur();
 $("ivl").innerHTML=IK.map((t,i)=>{const c=cfgOf(v,t);return `<div class="mb-3"><div class="fw-semibold mb-1">${iconOf(t)} ${esc(t)}</div><div class="input-group"><input class="form-control" type="number" inputmode="numeric" min="0" id="ik${i}" value="${c.km}" aria-label="Kilomètres"><span class="input-group-text">km</span><input class="form-control" type="number" inputmode="numeric" min="0" id="im${i}" value="${c.m}" aria-label="Mois"><span class="input-group-text">mois</span></div></div>`}).join("");
 $("dI").showModal();
}
function saveIv(){
 const v=cur(),iv={};
 IK.forEach((t,i)=>{const k=Math.max(0,+$("ik"+i).value||0),m=Math.max(0,+$("im"+i).value||0);if(k!==TYPES[t].km||m!==TYPES[t].m)iv[t]={km:k,m}});
 if(Object.keys(iv).length)v.iv=iv;else delete v.iv;
 save();$("dI").close();render();
}
function pdf(){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J){alert("Module PDF non chargé : vérifie ta connexion et recharge la page.");return}
 const v=cur(),ents=S.e.filter(x=>x.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date));
 const d=new J({unit:"mm",format:"a4"}),n=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g," "),c=s=>String(s||"").replace(/[^\x20-\x7E\u00A0-\u00FF]/g,"?"),dt=s=>s.split("-").reverse().join("/");
 const total=ents.reduce((a,x)=>a+(+x.cost||0),0);
 d.setFont("helvetica","bold");d.setFontSize(18);d.text("Historique d'entretien",14,18);
 d.setFontSize(12);d.text(c(v.name),14,26);
 d.setFont("helvetica","normal");d.setFontSize(10);
 d.text("Kilométrage actuel : "+n(v.km)+" km  |  Généré le "+dt(today())+"  |  Total : "+n(total)+" EUR",14,32);
 const X=[14,34,92,120,150];let y=42;
 const head=()=>{d.setFont("helvetica","bold");d.setFontSize(10);["Date","Type","Km","Coût","Note"].forEach((t,i)=>d.text(t,X[i],y));d.line(14,y+2,196,y+2);y+=8;d.setFont("helvetica","normal")};
 head();
 groups(ents).forEach(g=>{
  const type=g.items.flatMap(x=>d.splitTextToSize((g.items.length>1?"- ":"")+c(norm(x.type)),56)),cost=g.items.reduce((a,x)=>a+(+x.cost||0),0),note=d.splitTextToSize(c([...new Set(g.items.map(x=>x.note).filter(Boolean))].join(" / ")),46),h=Math.max(type.length,note.length)*5+3;
  if(y+h>285){d.addPage();y=20;head()}
  d.text(dt(g.date),X[0],y);d.text(type,X[1],y);d.text(g.km!=null?n(g.km):"-",X[2],y);d.text(cost?n(cost)+" EUR":"-",X[3],y);d.text(note,X[4],y);
  y+=h;
 });
 d.save("entretien-"+c(v.name).replace(/[^\w-]+/g,"_")+"-"+today()+".pdf");
}

document.addEventListener("click",async e=>{
 const t=e.target;
 if(t.id==="login"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){
   if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment"){signInWithRedirect(auth,new GoogleAuthProvider())}
   else if(err.code!=="auth/popup-closed-by-user"&&err.code!=="auth/cancelled-popup-request"){const m=$("msg");if(m)m.textContent="Connexion impossible : "+(err.code||err.message)}}}
 if(t.closest("#fold")){open=!open;try{localStorage.setItem("suiviOpen",open?"1":"0")}catch(e){}render()}
 if(t.id==="pdf")pdf();
 if(t.id==="iv")openIv();
 if(t.id==="renV"){const n=prompt("Nom du véhicule :",cur().name);if(n!==null&&n.trim()){cur().name=n.trim();save();render()}}
 if(t.dataset.chk!==undefined){const v=cur(),n=Object.keys(TYPES)[+t.dataset.chk];
  if(v&&n&&confirm("Marquer « "+n+" » comme vérifié aujourd'hui à "+fmt(v.km)+" km ?\nL'échéance repart à zéro à partir de maintenant.")){v.ck=v.ck||{};v.ck[n]={date:today(),km:v.km};save();render()}}
 if(t.id==="saveI")saveIv();
 if(t.id==="resetI"&&confirm("Revenir aux intervalles par défaut pour ce véhicule ?")){delete cur().iv;save();$("dI").close();render()}
 if(t.id==="logout")signOut(auth);
 if(t.dataset.sel){pick(t.dataset.sel);render()}
 if(t.id==="addV"){$("vn").value="";$("vk").value="";$("dV").showModal()}
 if(t.dataset.close!==undefined)t.closest("dialog").close();
 if(t.id==="saveV"){const n=$("vn").value.trim();if(!n){$("vn").focus();return}
  const v={id:uid(),name:n,km:+$("vk").value||0};S.v.push(v);pick(v.id);save();$("dV").close();render()}
 if(t.id==="upKm"){const k=prompt("Kilométrage actuel :",cur().km);if(k!==null&&k!==""&&+k>=0){cur().km=+k;save();render()}}
 if(t.id==="addE")openE(null);
 if(t.dataset.edit){const v=cur(),g=groups(S.e.filter(x=>x.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date))).find(g=>g.date+"|"+(g.km==null?"":g.km)===t.dataset.edit);if(g)openE(g)}
 if(t.id==="saveE"){const v=cur(),km=$("ek").value===""?null:+$("ek").value;
  const TK=Object.keys(TYPES),ch=TK.map((x,i)=>({x,i})).filter(o=>$("ec"+o.i)&&$("ec"+o.i).checked);
  if([...document.querySelectorAll('#etl [id^="eg"]')].some(e=>e.checked&&!e.closest(".pickg").querySelector(".sub input:checked"))){alert("Choisis Avant et/ou Arrière pour chaque entretien concerné.");return}
  if(!ch.length&&!editKeep.length){alert("Coche au moins un entretien.");return}
  const total=+$("etot").value||0,date=$("ed").value||today(),note=$("en").value.trim(),keepIds=editKeep.map(k=>k.id);
  if(editG){const ids=new Set(editG);S.e=S.e.filter(x=>!ids.has(x.id)||keepIds.includes(x.id))}
  const news=ch.map(o=>({id:uid()+o.i,vid:v.id,type:o.x,date,km,cost:0,note}));
  S.e.push(...news);
  const kept=S.e.filter(x=>keepIds.includes(x.id));kept.forEach(x=>{x.date=date;x.km=km});
  [...news,...kept].forEach((x,k)=>{x.cost=k===0?total:0});
  editG=null;editKeep=[];
  if(km!=null&&km>v.km)v.km=km;save();$("dE").close();render()}
 if(t.id==="delE"&&confirm("Supprimer cette visite et tous ses entretiens ?")){const ids=new Set(editG||[]);S.e=S.e.filter(x=>!ids.has(x.id));editG=null;editKeep=[];save();$("dE").close();render()}
 if(t.id==="delV"&&confirm("Supprimer ce véhicule et son historique ?")){const id=sel;S.v=S.v.filter(x=>x.id!==id);S.e=S.e.filter(x=>x.vid!==id);pick(S.v[0]?S.v[0].id:null);save();render()}
 if(t.id==="exp"){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="entretien-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
 if(t.id==="impb")$("imp").click();
});
$("etl").addEventListener("change",e=>{const id=e.target.id;if(id.startsWith("eg")){const q=$("es"+id.slice(2));q.hidden=!e.target.checked;if(!e.target.checked)q.querySelectorAll("input").forEach(x=>x.checked=false)}});
$("imp").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.v)||!Array.isArray(d.e))throw 0;
  if(confirm("Remplacer toutes tes données actuelles par cette sauvegarde ?")){S={v:d.v,e:d.e};pick(S.v[0]?S.v[0].id:null);save();render()}}
 catch(err){alert("Fichier de sauvegarde invalide.")}
});
</script>
</body>
</html>
